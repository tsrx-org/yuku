name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build.zig.zon pins Yuku by commit and hash, so zig build fetches it
      - name: Set up Zig 0.17.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check Zig formatting
        run: zig fmt --check build.zig build.zig.zon src

      # the tests and the typecheck import the built package by its name
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      # parses every source of test/suite
      - name: Test
        run: bun test

      # the WebAssembly uses SIMD, which Node.js runs from 16.4
      - name: Run on the minimum Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 16.4.0
          package-manager-cache: false

      - name: Parse a source on Node.js 16.4
        run: |
          node --version
          node --input-type=module -e '
            import { parse } from "@tsrx/yuku";
            const { program, diagnostics } = parse("export const A = () => <p>{x}</p>", { path: "a.tsrx" });
            if (program.type !== "Program" || diagnostics.length !== 0) throw new Error("did not parse");
            console.log("parsed on", process.version);
          '
