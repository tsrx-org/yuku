name: M3 provenance

on:
  push:
    branches:
      - m3/provenance
      - main
      - "docs/**"
  pull_request:
    paths:
      - docs/**
      - tools/build-wasm.mjs
      - tools/wasm-smoke.mjs
      - tools/wasm-stamp.mjs
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  docs:
    name: Docs site (skips when zig-out/wasm is absent)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pnpm 10.33.2
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.33.2

      - name: Set up Node 24.15.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # zig-out/ is gitignored and the wasm needs zig plus the Yuku seam
      # checkout, so a plain checkout has no binary. Build it in an earlier
      # step with `node tools/build-wasm.mjs` (which also stamps it) to turn
      # the rest of this job on.
      - name: Check for the wasm build
        id: wasm
        run: |
          if [ -f zig-out/wasm/yuku-tsrx.wasm ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=docs job skipped::zig-out/wasm/yuku-tsrx.wasm is not in this checkout; the docs build and the browser verification did not run"
          fi

      - name: Install headless Chromium
        if: steps.wasm.outputs.present == 'true'
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Build the docs
        if: steps.wasm.outputs.present == 'true'
        run: pnpm run docs:build

      - name: Check every playground fence parses
        if: steps.wasm.outputs.present == 'true'
        run: node tools/wasm-smoke.mjs --fences

      - name: Verify the interactive surfaces in Chromium
        if: steps.wasm.outputs.present == 'true'
        run: node docs/verify-playground.mjs

  verify:
    name: Verify M0-M3 provenance
    if: github.ref == 'refs/heads/m3/provenance'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out yuku-tsrx event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: tsrx-org/yuku
          ref: ${{ github.sha }}
          path: yuku-tsrx
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact prior-art Yuku
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: thejackshelton/yuku
          ref: bf03e146d97ae2f0c2d4c4ec90456e1e544d2760
          path: yuku
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact generic Yuku seam
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: thejackshelton/yuku
          ref: 3a89a91f4dfb68d9a08d4dc2795433eb861ba10b
          path: yuku-dialect
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - name: Set up pnpm 10.33.2
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.33.2

      - name: Set up Node 24.15.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: yuku-tsrx/pnpm-lock.yaml

      - name: Set up ripgrep 15.2.0
        run: |
          archive="$RUNNER_TEMP/ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz"
          ripgrep_dir="$RUNNER_TEMP/ripgrep-15.2.0-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' \
            33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c \
            "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          test -x "$ripgrep_dir/rg"
          test "$("$ripgrep_dir/rg" --version | sed -n '1p')" = "ripgrep 15.2.0 (rev e89fff89ac)"
          printf '%s\n' "$ripgrep_dir" >> "$GITHUB_PATH"

      - name: Verify exact repository identities
        working-directory: yuku-tsrx
        run: |
          test "$(command -v rg)" = "$RUNNER_TEMP/ripgrep-15.2.0-x86_64-unknown-linux-musl/rg"
          test "$(rg --version | sed -n '1p')" = "ripgrep 15.2.0 (rev e89fff89ac)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C ../yuku rev-parse HEAD)" = bf03e146d97ae2f0c2d4c4ec90456e1e544d2760
          git -C ../yuku fetch --no-tags --depth=1 origin eb2adcb4c17da16e7ade1a0517192d81d469e67f
          git -C ../yuku cat-file -e eb2adcb4c17da16e7ade1a0517192d81d469e67f^{commit}
          test -z "$(git -C ../yuku status --porcelain=v1 --untracked-files=all)"
          test "$(git -C ../yuku-dialect rev-parse HEAD)" = 3a89a91f4dfb68d9a08d4dc2795433eb861ba10b
          test "$(git -C ../yuku-dialect rev-parse HEAD^)" = eb2adcb4c17da16e7ade1a0517192d81d469e67f
          test "$(git -C ../yuku-dialect merge-base HEAD eb2adcb4c17da16e7ade1a0517192d81d469e67f)" = eb2adcb4c17da16e7ade1a0517192d81d469e67f
          git -C ../yuku-dialect switch --create seam/dialect
          test "$(git -C ../yuku-dialect symbolic-ref --short HEAD)" = seam/dialect
          ! git -C ../yuku-dialect rev-parse --abbrev-ref --symbolic-full-name "@{u}"
          test -z "$(git -C ../yuku-dialect status --porcelain=v1 --untracked-files=all)"
          ! git -C ../yuku-dialect grep -in tsrx HEAD -- src tools

      - name: Install exact project toolchain
        working-directory: yuku-tsrx
        run: |
          test "$(zig version)" = 0.16.0
          test "$(node --version)" = v24.15.0
          test "$(pnpm --version)" = 10.33.2
          pnpm install --frozen-lockfile
          pnpm exec vite --version
          pnpm vp --version
          pnpm exec tsc --version
          pnpm exec vitest --version
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const { readFileSync } = require("node:fs");
          for (const [name, expected] of [
            ["@tsrx/core", "0.1.32"],
            ["typescript", "5.9.3"],
            ["vite", "8.0.16"],
            ["vite-plus", "0.1.20"],
            ["vitest", "4.1.5"],
          ]) {
            const actual = JSON.parse(readFileSync(`node_modules/${name}/package.json`, "utf8")).version;
            assert.equal(actual, expected, name);
          }
          NODE
          pnpm vp --version > "$RUNNER_TEMP/vp-version.txt"
          grep -F "vite-plus  v0.1.20" "$RUNNER_TEMP/vp-version.txt"
          grep -F "vite             v8.0.10" "$RUNNER_TEMP/vp-version.txt"

      - name: Build immutable prior-art oracle binding
        working-directory: yuku-tsrx
        run: |
          oracle="$RUNNER_TEMP/yuku-prior-art-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          pristine="$RUNNER_TEMP/yuku-prior-art-build.zig"
          paths="$RUNNER_TEMP/yuku-prior-art-paths"
          before="$RUNNER_TEMP/yuku-prior-art-before.sha256"
          after="$RUNNER_TEMP/yuku-prior-art-after.sha256"
          build_diff="$RUNNER_TEMP/yuku-prior-art-build.diff"
          test ! -e "$oracle"
          mkdir -p "$oracle"
          git -C ../yuku archive bf03e146d97ae2f0c2d4c4ec90456e1e544d2760 | tar -x -C "$oracle"
          test "$(sha256sum "$oracle/build.zig" | cut -d ' ' -f 1)" = be3fed64ef6855ec25cb37780d339257a4db2f7f3cea89460ca8571b4f452ff0
          test "$(sha256sum "$oracle/build.zig.zon" | cut -d ' ' -f 1)" = cced5b559fd61dff792bce2f726bd74daae6603189606b5607fc4be4fede267a
          (
            cd "$oracle"
            find . -type f ! -path ./build.zig -print0 | LC_ALL=C sort -z > "$paths"
            xargs -0 sha256sum < "$paths" > "$before"
            test "$(grep -Fxc '    b.installArtifact(profiler_exe);' build.zig)" = 1
            cp build.zig "$pristine"
            sed -i '/^    b\.installArtifact(profiler_exe);$/d' build.zig
            remaining="$(grep -Fxc '    b.installArtifact(profiler_exe);' build.zig || true)"
            test "$remaining" = 0
            test "$(sha256sum build.zig | cut -d ' ' -f 1)" = 4bf85abd713ce5a073a6509df8756b4b1ff1b0adf065bdf313998d64e096f3c7
            test "$(sha256sum build.zig.zon | cut -d ' ' -f 1)" = cced5b559fd61dff792bce2f726bd74daae6603189606b5607fc4be4fede267a
            diff_status=0
            diff -u "$pristine" build.zig > "$build_diff" || diff_status=$?
            test "$diff_status" = 1
            test "$(grep -Ec '^-[^-]' "$build_diff")" = 1
            additions="$(grep -Ec '^\+[^+]' "$build_diff" || true)"
            test "$additions" = 0
            test "$(grep -Fxc -- '-    b.installArtifact(profiler_exe);' "$build_diff")" = 1
            cat "$build_diff"
            test ! -e profiler/files
            zig build -Dnpm=true -Dnpm-host=true -Dnpm-only=yuku-parser -Doptimize=ReleaseFast
            test ! -e zig-out/bin/profiler
            xargs -0 sha256sum < "$paths" > "$after"
            cmp "$before" "$after"
            test "$(sha256sum build.zig | cut -d ' ' -f 1)" = 4bf85abd713ce5a073a6509df8756b4b1ff1b0adf065bdf313998d64e096f3c7
            test "$(sha256sum build.zig.zon | cut -d ' ' -f 1)" = cced5b559fd61dff792bce2f726bd74daae6603189606b5607fc4be4fede267a
            test ! -e profiler/files
          )
          host="$oracle/zig-out/npm/yuku-parser"
          test -f "$host/package.json"
          test -f "$host/binding.js"
          test -f "$host/index.js"
          test -f "$host/index.d.ts"
          test -f "$host/@yuku-parser/binding-linux-x64-gnu/yuku-parser.node"
          export NODE_PATH="$host"
          export ORACLE_INDEX="$oracle/npm/yuku-parser/index.js"
          export ORACLE_HOST="$host"
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import { existsSync, readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";
          import { pathToFileURL } from "node:url";

          const host = process.env.ORACLE_HOST;
          const oracleIndex = process.env.ORACLE_INDEX;
          assert(host);
          assert(oracleIndex);
          const packageJson = JSON.parse(readFileSync(join(host, "package.json"), "utf8"));
          const optional = Object.keys(packageJson.optionalDependencies ?? {});
          assert.equal(optional.length, 11);
          assert(optional.every((name) => name.startsWith("@yuku-parser/binding-")));
          const bindingRoot = join(host, "@yuku-parser");
          const hostPackages = readdirSync(bindingRoot, { withFileTypes: true })
            .filter((entry) => entry.isDirectory());
          assert.deepEqual(hostPackages.map((entry) => entry.name), ["binding-linux-x64-gnu"]);
          assert(existsSync(join(bindingRoot, "binding-linux-x64-gnu", "yuku-parser.node")));
          const oracle = await import(pathToFileURL(oracleIndex).href);
          const result = oracle.parse("export const view = <p>oracle</p>;", {
            lang: "tsrx",
            sourceType: "module",
          });
          assert.equal(result.program.type, "Program");
          assert.deepEqual(result.diagnostics, []);
          NODE
          echo "NODE_PATH=$host" >> "$GITHUB_ENV"
          test -z "$(git -C ../yuku status --porcelain=v1 --untracked-files=all)"

      - name: Verify M0 control
        working-directory: yuku-tsrx
        run: |
          node tools/m0-control.ts --yuku ../yuku --ref eb2adcb4c17da16e7ade1a0517192d81d469e67f -- zig build test

      - name: Verify root and generic seam Zig gates
        working-directory: yuku-tsrx
        run: |
          zig build test test-m1-module-cycle test-m2-binding-seam test-m2-fixtures -Doptimize=ReleaseFast
          (
            cd ../yuku-dialect
            zig build test-dialect-capacity test
          )

      - name: Verify M1 scope identity and hook contract
        working-directory: yuku-tsrx
        run: |
          node tools/m1-control.ts --check-worktrees --check-scope --check-no-tsrx --check-no-runtime-dispatch --control-yuku ../yuku --seam-yuku ../yuku-dialect --compare-ref eb2adcb4c17da16e7ade1a0517192d81d469e67f
          node tools/m1-control.ts --check-hook-contract --control-yuku ../yuku --seam-yuku ../yuku-dialect --compare-ref eb2adcb4c17da16e7ade1a0517192d81d469e67f

      - name: Verify M1 sentinel behavior
        working-directory: yuku-tsrx
        run: |
          node tools/m1-control.ts --mode sentinel --control-yuku ../yuku --seam-yuku ../yuku-dialect --compare-ref eb2adcb4c17da16e7ade1a0517192d81d469e67f --all-hooks --capacity --layout --roundtrip --generated-diff --malformed --overflow --overlay-cost --positive-negative

      - name: Verify reflected transfer and generators
        working-directory: yuku-tsrx
        run: |
          zig build m1-reflected-transfer-fixtures gen-m1-dialect-decoder gen-m1-dialect-encoder
          node tools/m1-reflected-transfer.ts --control-yuku ../yuku --seam-yuku ../yuku-dialect --compare-ref eb2adcb4c17da16e7ade1a0517192d81d469e67f

      - name: Verify unified generated identity
        working-directory: yuku-tsrx
        run: |
          pnpm check:m3-generated
          cmp zig-out/decode.js npm/yuku-tsrx/decode.js
          cmp zig-out/decode-analyzer.js npm/yuku-tsrx/decode-analyzer.js
          cmp zig-out/encode.js npm/yuku-tsrx/encode.js
          git -C ../yuku show eb2adcb4c17da16e7ade1a0517192d81d469e67f:npm/yuku-parser/decode.js > "$RUNNER_TEMP/eb2-decode.js"
          cmp zig-out/dialect-free-decode.js "$RUNNER_TEMP/eb2-decode.js"
          test "$(sha256sum zig-out/dialect-free-decode.js | cut -d ' ' -f 1)" = 78c9a9624749aa34785f7ff2a9289aa9eb00381b844a5eac1a847cc288213087

      - name: Verify native M3 runtime type and failure contracts
        working-directory: yuku-tsrx
        run: |
          zig build -Doptimize=ReleaseFast
          test -f zig-out/lib/yuku-tsrx.node
          export YUKU_TSRX_BINDING="$PWD/zig-out/lib/yuku-tsrx.node"
          echo "YUKU_TSRX_BINDING=$YUKU_TSRX_BINDING" >> "$GITHUB_ENV"
          pnpm exec tsc --noEmit --pretty false
          pnpm vp check
          pnpm vp lint
          pnpm vp fmt --check
          pnpm vp test -- test/m3.test.ts test/m3-types.test.ts test/m3-generated.test.ts

      - name: Verify complete retained 35-test suite
        working-directory: yuku-tsrx
        run: pnpm vp test

      - name: Verify generated host platform contract
        working-directory: yuku-tsrx
        run: |
          zig build -Dnpm=true -Dnpm-host=true -Doptimize=ReleaseFast
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import { existsSync, readFileSync, readdirSync } from "node:fs";
          import { join, resolve } from "node:path";
          import { pathToFileURL } from "node:url";

          const sourcePackage = JSON.parse(readFileSync("npm/yuku-tsrx/package.json", "utf8"));
          assert.equal(Object.hasOwn(sourcePackage, "optionalDependencies"), false);

          const hostRoot = resolve("zig-out/npm/yuku-tsrx");
          const hostPackage = JSON.parse(readFileSync(join(hostRoot, "package.json"), "utf8"));
          const optional = Object.keys(hostPackage.optionalDependencies ?? {});
          assert.equal(optional.length, 12);
          assert(optional.every((name) => name.startsWith("@yuku-tsrx/binding-")));

          const bindingRoot = join(hostRoot, "@yuku-tsrx");
          const hostBindings = readdirSync(bindingRoot, { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .filter((entry) => existsSync(join(bindingRoot, entry.name, "yuku-tsrx.node")));
          assert.equal(hostBindings.length, 1);

          const generated = await import(pathToFileURL(join(hostRoot, "index.js")).href);
          const result = generated.parse(
            new TextEncoder().encode("export const view = <p>host</p>;"),
            { lang: "tsx", sourceType: "module" },
          );
          assert(result instanceof ArrayBuffer);
          NODE

      - name: Verify generic FFI and serialization boundaries
        working-directory: yuku-tsrx
        run: |
          git -C ../yuku-dialect show HEAD:src/parser/ffi/parser.zig > "$RUNNER_TEMP/seam-parser-ffi.zig"
          git -C ../yuku show eb2adcb4c17da16e7ade1a0517192d81d469e67f:src/parser/ffi/parser.zig > "$RUNNER_TEMP/eb2-parser-ffi.zig"
          cmp "$RUNNER_TEMP/seam-parser-ffi.zig" "$RUNNER_TEMP/eb2-parser-ffi.zig"
          test "$(grep -c 'return ab\.val;' "$RUNNER_TEMP/seam-parser-ffi.zig")" = 1
          ! rg -n 'JSON\.(parse|stringify)' npm/yuku-tsrx/*.js zig-out/decode.js zig-out/decode-analyzer.js zig-out/encode.js zig-out/dialect-free-decode.js

      - name: Verify final formatting mutation safety and clean diffs
        working-directory: yuku-tsrx
        run: |
          zig fmt --check . ../yuku-dialect
          git diff --check
          git diff --cached --check
          git -C ../yuku diff --check
          git -C ../yuku-dialect diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C ../yuku status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C ../yuku-dialect status --porcelain=v1 --untracked-files=all)"
          cmp zig-out/decode.js npm/yuku-tsrx/decode.js
          cmp zig-out/decode-analyzer.js npm/yuku-tsrx/decode-analyzer.js
          cmp zig-out/encode.js npm/yuku-tsrx/encode.js
