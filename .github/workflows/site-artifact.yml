# Build and verify the docs artifact; Vercel's Git integration deploys it.
name: Build website artifact

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-artifact-${{ github.ref }}
  # A superseded pull-request run is wasted wall clock; a superseded run on
  # main is a deploy that never happened, so those still queue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SEAM_REPOSITORY: thejackshelton/yuku
  SEAM_REF: 0aac786cdda22d06e8669abe198d6d1d6bd72183

jobs:
  build:
    name: Build and verify the site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          path: yuku

      # The wasm module is a zig artifact built against the sibling seam.
      - name: Check out the pinned Yuku seam
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          repository: ${{ env.SEAM_REPOSITORY }}
          ref: ${{ env.SEAM_REF }}
          path: yuku-minimal-seam
          persist-credentials: false

      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - name: Set up pnpm 10.33.2
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.33.2

      - name: Set up Node 24.15.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: yuku/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: yuku
        run: pnpm install --frozen-lockfile --ignore-scripts

      # zig build wasm, the smoke test, and the stamp yuku-website/build.mjs checks
      # against HEAD:src.
      - name: Build and stamp the wasm module
        working-directory: yuku
        run: pnpm run docs:wasm

      - name: Build the site for yuku.tsrx.dev
        working-directory: yuku
        run: pnpm run docs:build

      - name: Check every playground fence parses
        working-directory: yuku
        run: node tools/wasm-smoke.mjs --fences

      - name: Install headless Chromium
        working-directory: yuku
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Verify the interactive surfaces in Chromium
        working-directory: yuku
        run: node yuku-website/verify-playground.mjs

      - name: Upload the site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yuku-docs-${{ github.sha }}
          path: yuku/yuku-website/dist
          if-no-files-found: error
          retention-days: 14

      # The old location: nothing but a vercel.json that 308s /yuku-tsrx and
      # every path under it to the same path on yuku.tsrx.dev.
      - name: Build the redirect-only site for compiled.run/yuku-tsrx
        working-directory: yuku
        env:
          SITE_ORIGIN: https://compiled.run
          SITE_BASE: /yuku-tsrx/
          YUKU_TSRX_DOCS_OUT_DIR: /tmp/yuku-tsrx-legacy-redirect
        run: |
          node yuku-website/build.mjs --redirect-only
          cat /tmp/yuku-tsrx-legacy-redirect/vercel.json

      - name: Upload the redirect-only site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yuku-docs-legacy-redirect-${{ github.sha }}
          path: /tmp/yuku-tsrx-legacy-redirect
          if-no-files-found: error
          retention-days: 14

      - name: Publish and pin a new docs WASM source tree
        if: >-
          github.repository == 'tsrx-org/yuku' &&
          github.event_name == 'push' &&
          github.ref_name == 'main'
        working-directory: yuku
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          src_tree="$(git rev-parse HEAD:src)"
          pinned_tree="$(jq -r '.srcTree' yuku-website/wasm-pin.json)"
          if [ "${src_tree}" = "${pinned_tree}" ]; then
            echo "The pin already matches src tree ${src_tree}."
            exit 0
          fi

          short="${src_tree:0:12}"
          asset="yuku-tsrx-${short}.wasm"
          upload_dir="$(mktemp -d)"
          cp zig-out/wasm/yuku-tsrx.wasm "${upload_dir}/${asset}"
          cp zig-out/wasm/yuku-tsrx.wasm.stamp "${upload_dir}/${asset}.stamp"

          gh release create docs-wasm \
            --title "docs-wasm" \
            --notes "Rolling prebuilt WASM artifacts for the yuku.tsrx.dev Vercel build." \
            || true
          gh release upload docs-wasm \
            "${upload_dir}/${asset}" \
            "${upload_dir}/${asset}.stamp" \
            --clobber

          jq -n \
            --arg release "docs-wasm" \
            --arg asset "${asset}" \
            --arg sha256 "$(shasum -a 256 zig-out/wasm/yuku-tsrx.wasm | cut -d' ' -f1)" \
            --arg srcTree "${src_tree}" \
            --argjson sizeBytes "$(stat -c%s zig-out/wasm/yuku-tsrx.wasm)" \
            '{ release: $release, asset: $asset, sha256: $sha256, srcTree: $srcTree, sizeBytes: $sizeBytes }' \
            > yuku-website/wasm-pin.json

          git add yuku-website/wasm-pin.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "site: pin wasm ${short}"
          # The build rewrote tracked files (the site's vercel.json); the rebase needs a clean tree.
          git stash push --include-untracked --quiet || true
          git fetch origin main
          git rebase FETCH_HEAD
          git push origin HEAD:main
