# Publish @tsrx/yuku and its two binding packages to npm.
#
# Pushing a tag `v<version>` publishes that version. A manual dispatch defaults
# to a dry run that rehearses everything and publishes nothing; publishing from
# a dispatch additionally needs the confirmation phrase `PUBLISH <version>`.
#
# Authentication is npm Trusted Publishing over GitHub Actions OIDC. There is no
# NPM_TOKEN anywhere in this file and none is needed: `id-token: write` on the
# publish job is the whole credential, and npm attaches a provenance attestation
# on its own. Two things must be true first, and neither is something a workflow
# can do for itself: each of the three names must already exist on the registry
# (scripts/publish-placeholders.mjs), and each must have a trusted publisher
# pointing at this repository and at the file name `publish.yml` exactly
# (scripts/trust-publishers.sh). .github/releasing/launch-runbook.md is the order.
#
# The bytes published are the ones release-candidate.yml built on this run from
# this exact revision, checksummed, and never touched by a human.
name: Publish to npm

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run rehearses everything and publishes nothing. publish is irreversible."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      confirm:
        description: "Required only when mode is publish. Type: PUBLISH <version>"
        required: false
        default: ""
        type: string
      dist_tag:
        description: "dist-tag to publish under. Leave empty for latest."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

env:
  npm_config_audit: "false"
  npm_config_fund: "false"

jobs:
  # First and alone, so a mistyped phrase or a tag that does not match the
  # manifests costs one cheap job instead of two Zig builds.
  gate:
    name: gate
    # A fork cannot publish these names, and should not try.
    if: github.repository == 'tsrx-org/yuku'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      mode: ${{ steps.resolve.outputs.mode }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false

      - name: Install Node.js 24.15.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      # Free-text inputs are passed through the environment, never
      # interpolated into a shell command.
      - name: Resolve the version and the mode
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
          INPUT_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          manifest_version=$(node -p "require('./package.json').version")
          if [[ "$EVENT" == "push" ]]; then
            version="${REF_NAME#v}"
            mode=publish
            if [[ "$version" != "$manifest_version" ]]; then
              echo "tag $REF_NAME does not match the root package.json version $manifest_version" >&2
              exit 1
            fi
          else
            version="$manifest_version"
            mode="$INPUT_MODE"
            if [[ "$mode" == "publish" && "$INPUT_CONFIRM" != "PUBLISH $version" ]]; then
              echo "mode=publish requires confirm to be exactly: PUBLISH $version" >&2
              exit 1
            fi
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must look like 1.2.3 or 1.2.3-rc.1, got: $version" >&2; exit 1 ;;
          esac
          node scripts/sync-version.ts --check --version "$version"
          test -f LICENSE || { echo "no LICENSE file at the repository root" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${INPUT_DIST_TAG:-latest}" >> "$GITHUB_OUTPUT"
          if [[ "$mode" == "publish" ]]; then
            echo "mode=publish for $version. This is irreversible."
          else
            echo "mode=dry-run for $version: nothing will be published."
          fi

  candidate:
    name: candidate
    needs: gate
    uses: ./.github/workflows/release-candidate.yml
    permissions:
      contents: read

  publish:
    name: ${{ needs.gate.outputs.mode }} ${{ needs.gate.outputs.version }}
    needs:
      - gate
      - candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      MODE: ${{ needs.gate.outputs.mode }}
      DIST_TAG: ${{ needs.gate.outputs.dist_tag }}
    steps:
      - name: Install Node.js 24.15.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Pinned so the publishing npm does not move when the Node pin moves; the
      # assert turns a silently too-old npm into a failed job rather than an
      # unexplained ENEEDAUTH.
      - name: Pin an npm new enough for trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.18.0
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          const actual = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          const [a, b, c] = actual.split(".").map(Number);
          const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
          assert.ok(ok, `npm ${actual} is older than 11.5.1, which trusted publishing requires`);
          console.log(`npm ${actual} satisfies the trusted-publishing floor`);
          NODE

      - name: Download the candidate this run built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          path: release

      - name: Re-verify the candidate checksums
        shell: bash
        working-directory: release
        run: sha256sum --check SHA256SUMS

      # Bindings first, meta last. @tsrx/yuku lists both bindings in
      # optionalDependencies and npm resolves those at install time against
      # whatever is on the registry at that moment: publish the meta package
      # first and a consumer in that window installs JavaScript with no addon
      # behind it and no error saying so.
      - name: Resolve the publish order from the tarballs
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { writeFile } from "node:fs/promises";
          const version = process.env.VERSION;
          const order = ["@tsrx/yuku-darwin-arm64", "@tsrx/yuku-linux-x64-gnu", "@tsrx/yuku"];
          const tarball = (name) =>
            name === "@tsrx/yuku"
              ? `release/tsrx-yuku-${version}.tgz`
              : `release/tsrx-yuku-${name.slice("@tsrx/yuku-".length)}-${version}.tgz`;
          const manifests = new Map();
          for (const name of order) {
            const path = tarball(name);
            const manifest = JSON.parse(
              execFileSync("tar", ["-xzOf", path, "package/package.json"], { encoding: "utf8" }),
            );
            assert.equal(manifest.name, name, `${path}: unexpected package name`);
            assert.equal(manifest.version, version, `${name}: version is not ${version}`);
            assert.equal(manifest.publishConfig?.access, "public", `${name}: not public`);
            assert.equal(manifest.publishConfig?.provenance, true, `${name}: provenance is off`);
            assert.notEqual(manifest.license, "UNLICENSED", `${name}: unlicensed`);
            manifests.set(name, path);
          }
          const meta = JSON.parse(
            execFileSync("tar", ["-xzOf", tarball("@tsrx/yuku"), "package/package.json"], { encoding: "utf8" }),
          );
          assert.deepEqual(
            Object.keys(meta.optionalDependencies ?? {}).sort(),
            order.slice(0, -1).sort(),
            "@tsrx/yuku optionalDependencies must be exactly the two bindings",
          );
          for (const name of order.slice(0, -1)) {
            assert.equal(meta.optionalDependencies[name], version, `${name} must be pinned to ${version}`);
          }
          await writeFile("publish-order.txt", `${order.map((name) => `${name} ${manifests.get(name)}`).join("\n")}\n`);
          for (const name of order) console.log(`  ${name}  ${manifests.get(name)}`);
          NODE
          if [[ "$DIST_TAG" != "latest" ]]; then
            echo "WARNING: the dist-tag is $DIST_TAG, so \`npm install @tsrx/yuku\` will not resolve it."
          fi

      # Always rehearsed, in both modes. Provenance is off for the rehearsal
      # only: a dry run has nothing to attest. This is also the check that the
      # version is still free on the registry.
      - name: Rehearse the publish
        shell: bash
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          set -euo pipefail
          while read -r name path; do
            echo "::group::dry-run $name"
            # `./` is load-bearing: npm reads a bare `release/x.tgz` as the
            # GitHub shorthand `user/repo`.
            npm publish "./$path" --tag "$DIST_TAG" --access public --dry-run
            echo "::endgroup::"
          done < publish-order.txt

      # The only step that writes to the registry.
      - name: Publish, bindings first
        if: needs.gate.outputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          while read -r name path; do
            echo "::group::publish $name"
            npm publish "./$path" --tag "$DIST_TAG" --access public
            echo "::endgroup::"
          done < publish-order.txt

      # The backstop, and only the backstop: npm versions are immutable, so
      # nothing here can prevent a bad release, only find one (the remedy is
      # deprecate and patch). It installs the published version into a project
      # outside this workspace, resolves the binding through the published
      # optionalDependencies the way a consumer's first install does, and
      # parses a real .tsrx source through the installed addon.
      - name: Install the published release from the registry and run it
        if: needs.gate.outputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/publish-probe"
          rm -rf "$probe"
          mkdir -p "$probe"
          cd "$probe"
          npm init -y > /dev/null
          # A read can hit a replica that has not caught up with the write.
          npm install "@tsrx/yuku@$VERSION" || (sleep 30 && npm install "@tsrx/yuku@$VERSION")
          test -f node_modules/@tsrx/yuku-linux-x64-gnu/yuku-tsrx.node
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { parseModule } from "@tsrx/yuku";
          const program = parseModule("export const view = <p>published</p>;", "probe.tsrx");
          assert.equal(program.type, "Program");
          assert.equal(program.body.length, 1);
          assert.equal(program.body[0].type, "ExportNamedDeclaration");
          console.log("the published release parsed a real .tsrx source through the native addon");
          NODE
