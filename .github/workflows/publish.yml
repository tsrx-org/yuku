# Publishes @tsrx/yuku to npm through npm trusted publishing, with no token.
#
# A tag v<version> publishes that version. A manual run is a dry run unless mode is publish and
# confirm is exactly "PUBLISH <version>". The trusted publisher on npm names this repository and
# the file name publish.yml, so this file keeps its name.
name: Publish to npm

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run builds, tests and rehearses, publishing nothing. publish is irreversible."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      confirm:
        description: "Required only when mode is publish. Type: PUBLISH <version>"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

env:
  npm_config_audit: "false"
  npm_config_fund: "false"

jobs:
  build:
    name: build and test
    if: github.repository == 'tsrx-org/yuku'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # free-text inputs go through the environment, never into the script
      - name: Resolve the version and the mode
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          manifest_version=$(node -p "require('./package.json').version")
          if [[ "$EVENT" == "push" ]]; then
            version="${REF_NAME#v}"
            mode=publish
            if [[ "$version" != "$manifest_version" ]]; then
              echo "tag $REF_NAME does not match package.json version $manifest_version" >&2
              exit 1
            fi
          else
            version="$manifest_version"
            mode="$INPUT_MODE"
            if [[ "$mode" == "publish" && "$INPUT_CONFIRM" != "PUBLISH $version" ]]; then
              echo "mode=publish requires confirm to be exactly: PUBLISH $version" >&2
              exit 1
            fi
          fi
          # releases are minor only
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.0(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "version must look like 0.9.0 or 0.9.0-rc.1, got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "$mode $version"

      - name: Set up Zig 0.17.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: |
          bun run build
          bun run typecheck
          bun test

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          npm pack --pack-destination release
          cd release
          test -f "tsrx-yuku-${{ steps.resolve.outputs.version }}.tgz"
          tar -tzf tsrx-yuku-*.tgz | sort
          sha256sum tsrx-yuku-*.tgz > SHA256SUMS

      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsrx-yuku-${{ steps.resolve.outputs.version }}
          path: release
          if-no-files-found: error
          retention-days: 30

  publish:
    name: ${{ needs.build.outputs.mode }} ${{ needs.build.outputs.version }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Set up Node.js 24.15.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # trusted publishing needs npm 11.5.1 or newer
      - name: Pin npm
        shell: bash
        run: |
          set -euo pipefail
          npm install -g npm@11.18.0
          node -e '
            const [a, b, c] = require("child_process").execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number);
            if (!(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))))) throw new Error("npm is older than 11.5.1");
          '

      - name: Download the tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tsrx-yuku-${{ needs.build.outputs.version }}
          path: release

      - name: Verify the tarball
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          manifest=$(tar -xzOf "tsrx-yuku-$VERSION.tgz" package/package.json)
          node -e '
            const m = JSON.parse(process.argv[1]);
            if (m.name !== "@tsrx/yuku" || m.version !== process.env.VERSION) throw new Error("tarball is " + m.name + "@" + m.version);
            if (m.publishConfig?.access !== "public") throw new Error("publishConfig.access is not public");
          ' "$manifest"

      # the leading ./ keeps npm from reading release/x.tgz as a GitHub repo
      - name: Rehearse the publish
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: npm publish "./release/tsrx-yuku-$VERSION.tgz" --access public --dry-run

      - name: Publish
        if: needs.build.outputs.mode == 'publish'
        run: npm publish "./release/tsrx-yuku-$VERSION.tgz" --access public --provenance
